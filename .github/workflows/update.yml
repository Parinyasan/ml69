name: Update Dashboard Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 # <-- อัปเดตเป็น v4 แล้ว

    - name: Set up Python
      uses: actions/setup-python@v5 # <-- อัปเดตเป็น v5 แล้ว
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install PyGithub

    - name: Run Data Fetcher
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python update_data.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json || echo "No data.json to add"
        git commit -m "Auto-update company data" || echo "No changes to commit"
        git push
