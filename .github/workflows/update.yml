name: Update Dashboard Data

on:
  schedule:
    # รันทุกๆ 1 ชั่วโมง (ปรับเวลาได้ตาม Cron syntax)
    - cron: '0 * * * *'
  workflow_dispatch: # เปิดให้กดรัน Manual ได้ด้วย

jobs:
  build:
    runs-on: ubuntu-latest
    
    # ให้สิทธิ์ Action ในการ Push โค้ดกลับลง Repo
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install PyGithub

    - name: Run Data Fetcher
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python update_data.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git commit -m "Auto-update company data" || echo "No changes to commit"
        git push