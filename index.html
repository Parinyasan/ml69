<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Class - Company Leaderboards</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f6f8fa; 
            padding: 2rem; 
            color: #24292f; 
        }
        .header-title { 
            text-align: center; 
            color: #0969da; 
            margin-bottom: 2rem;
        }
        
        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); /* ปรับให้ Card กว้างขึ้นเพื่อรับคอลัมน์ใหม่ */
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .company-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #0969da;
        }
        .company-title {
            margin-top: 0;
            color: #24292f;
            border-bottom: 2px solid #f0f3f6;
            padding-bottom: 10px;
            font-size: 1.25rem;
            text-align: center;
        }

        .member-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .member-table th, .member-table td { padding: 10px; text-align: center; border-bottom: 1px solid #eaeef2; }
        /* จัดให้คอลัมน์ Member ชิดซ้าย */
        .member-table th:nth-child(2), .member-table td:nth-child(2) { text-align: left; }
        
        .member-table th { color: #57606a; font-size: 0.85em; background-color: #f6f8fa; }
        
        .avatar { width: 32px; height: 32px; border-radius: 50%; vertical-align: middle; margin-right: 10px; }
        .rank { font-weight: bold; color: #57606a; width: 40px; }
        
        /* ใส่สีให้แยกประเภทชัดเจน */
        .val-commits { color: #57606a; font-size: 0.9em; }
        .val-issues { color: #8250df; font-size: 0.9em; } /* สีม่วงของ GitHub Issue */
        .val-prs { color: #2da44e; font-size: 0.9em; } /* สีเขียวของ GitHub PR */
        .val-total { font-weight: bold; color: #0969da; font-size: 1.1em; } /* สีฟ้าเด่นๆ สำหรับยอดรวม */
        
        .empty-state { text-align: center; color: #8c959f; padding: 20px; font-style: italic; }
    </style>
</head>
<body>
    <h1 class="header-title">🏆 ML Class - Contribution Leaderboard</h1>
    
    <div id="loading" style="text-align:center;">กำลังโหลดข้อมูล...</div>
    
    <div id="companies-container" class="companies-grid"></div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('companies-container');
                document.getElementById('loading').style.display = 'none';

                for (const [companyName, members] of Object.entries(data)) {
                    
                    // 1. เรียงลำดับจาก Total Contribution มากไปน้อย
                    members.sort((a, b) => b.total_contribution - a.total_contribution);

                    const card = document.createElement('div');
                    card.className = 'company-card';
                    
                    const title = document.createElement('h2');
                    title.className = 'company-title';
                    title.innerText = `🏢 ${companyName}`;
                    card.appendChild(title);

                    // ถ้าบริษัทยังไม่มีคนทำอะไรเลย
                    if (members.length === 0) {
                        const emptyMsg = document.createElement('div');
                        emptyMsg.className = 'empty-state';
                        emptyMsg.innerText = "ยังไม่มีข้อมูล Contribution ในบริษัทนี้";
                        card.appendChild(emptyMsg);
                        container.appendChild(card);
                        continue;
                    }

                    const table = document.createElement('table');
                    table.className = 'member-table';
                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Member</th>
                                <th title="Commits">💻 CM</th>
                                <th title="Issues">🎯 IS</th>
                                <th title="Pull Requests">🔄 PR</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    `;
                    const tbody = table.querySelector('tbody');

                    members.forEach((member, index) => {
                        const tr = document.createElement('tr');
                        
                        let rankDisplay = index + 1;
                        if (rankDisplay === 1) rankDisplay = '🥇';
                        else if (rankDisplay === 2) rankDisplay = '🥈';
                        else if (rankDisplay === 3) rankDisplay = '🥉';

                        tr.innerHTML = `
                            <td class="rank">${rankDisplay}</td>
                            <td>
                                <img src="${member.avatar}" class="avatar" alt="avatar">
                                <a href="https://github.com/${member.username}" target="_blank" style="text-decoration: none; color: #24292f; font-weight: 500;">
                                    ${member.username}
                                </a>
                            </td>
                            <td class="val-commits">${member.commits}</td>
                            <td class="val-issues">${member.issues}</td>
                            <td class="val-prs">${member.prs}</td>
                            <td class="val-total">${member.total_contribution}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    card.appendChild(table);
                    container.appendChild(card);
                }
            })
            .catch(error => {
                document.getElementById('loading').innerHTML = "❌ ไม่สามารถโหลดข้อมูลได้ หรือยังไม่มีข้อมูล";
            });
    </script>
</body>
</html>
